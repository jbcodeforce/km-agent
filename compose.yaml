# Docker Compose reads from .env by default (local development).
# Ollama runs on the host (see scripts/setup.sh + scripts/starter.sh), not in Compose.
services:
  agent-db:
    image: agnohq/pgvector:18
    container_name: agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KMA_DB_USER:-ai}
      POSTGRES_PASSWORD: ${KMA_DB_PASS:-ai}
      POSTGRES_DB: ${KMA_DB_DATABASE:-ai}
    volumes:
      # Named volume: bind-mounting the host over /var/lib/postgresql breaks the image
      # entrypoint (chown on PGDATA /var/lib/postgresql/18/docker) on Docker Desktop/macOS.
      - km-agent-postgres:/var/lib/postgresql
    # Host port -> container 5432. Use POSTGRES_PUBLISH_PORT (not DB_PORT) so an empty DB_PORT
    # in .env does not break publishing; host-side tools/tests use DB_PORT = this value.
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    networks:
      - km-agent

  km-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-jbcodeforce/km-agent}:${IMAGE_TAG:-latest}
    container_name: km-agent
    command: /app/.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload Python/Vue sources only — do not mount `.:/app` or you hide the image's
      # `/app/.venv` (uvicorn: no such file or directory) and replace it with the host tree.
      - ./src:/app/src
      # User files
      - ${KMA_CONTEXT_DIR:-./context}:/app/context
    environment:
      - RUNTIME_ENV=dev
      - AGNO_DEBUG=True
      - AGNO_DEBUG_LEVEL=${AGNO_DEBUG_LEVEL:-1}
      - PYTHONPATH=/app/src
      # Optional: LLM reasoning + SSE progress (see example.env)
      - KMA_AGENT_REASONING=${KMA_AGENT_REASONING:-}
      - KMA_STREAM_EVENTS=${KMA_STREAM_EVENTS:-}
      - KMA_SHOW_TEAM_MEMBERS=${KMA_SHOW_TEAM_MEMBERS:-}
      # Database
      - KMA_DB_HOST=agent-db
      - KMA_DB_PORT=5432
      - KMA_DB_USER=${KMA_DB_USER:-ai}
      - KMA_DB_PASS=${KMA_DB_PASS:-ai}
      - KMA_DB_DATABASE=${KMA_DB_DATABASE:-ai}
      - WAIT_FOR_DB=True
      - PRINT_ENV_ON_LOAD=False
      # API keys
      - EXA_API_KEY=${EXA_API_KEY:-}
      - KMA_PARALLEL_API_KEY=${KMA_PARALLEL_API_KEY:-}
      # Native Ollama on the host (run ./scripts/starter.sh). host.docker.internal is set below.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      # Git sync
      - GITHUB_ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN:-}
      - KMA_REPO_URL=${KMA_REPO_URL:-}
      # Files
      - KMA_CONTEXT_DIR=/app/context
    depends_on:
      - agent-db
    networks:
      - km-agent
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  km-agent:

volumes:
  km-agent-postgres:
