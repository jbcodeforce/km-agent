site_name: Knowledge Management tools with Agents v0.0.2
repo_url: https://github.com/jbcodeforce/km-agent.git
site_url: https://jeromeboyer.net/km-agent
copyright: Copyright &copy; 2026 Jerome Boyer
nav:
  - Foundations: 
    - Specifications: SPEC.md
    - Tracking: tracking.md
    - Architecture: architecture.md
    - Developer Guide: DEVELOPER_PRACTICES.md
    - User Guide: USER_GUIDE.md
    - Ontology: ONTOLOGY.md
theme: 
  name: material 
  #logo: images/logo.drawio.png
  logo: images/km_logo.png
  favicon: images/logo-blue.drawio.png
  palette:
    scheme: default
  language: en
  admonition:
      example: octicons/beaker-16
  features:
      - content.code.annotation
      - content.code.copy
      - content.tooltips
      - content.tabs.link
      - search.suggest
      - search.highlight
      - navigation.instant
      - navigation.instant.progress
      - navigation.tabs
      - navigation.tabs.sticky
      - navigation.tracking
      - navigation.sections
      - navigation.expand
      - navigation.top
      - navigation.footer
extra_css: ["extra.css"]
extra_javascript:
  # Pin Mermaid so Material does not rely on unpkg@11 resolution (can fail silently).
  - https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js
plugins:
  - search:
      lang: en
  - minify:
      minify_html: true
  - mkdocstrings
markdown_extensions:
  - abbr
  - attr_list
  - md_in_html
  - admonition
  - codehilite
  - footnotes
  - tables
  - pymdownx.blocks.caption
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.smartsymbols
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.tilde
  - pymdownx.snippets
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra:
  social:
    - icon: fontawesome/brands/github
      link: 'https://github.com/jbcodeforce'
    - icon: fontawesome/brands/linkedin
      link: 'https://linkedin.com/in/jeromeboyer'
